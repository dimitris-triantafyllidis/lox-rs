[package]
name = "lox-rs"
version = "0.1.0"
edition = "2024"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"

[[bin]]
name = "lox"
path = "src/lox.rs"

[[bin]]
name = "lox-scan"
path = "src/lox-scan.rs"

[[bin]]
name = "benchmark"
path = "src/benchmark.rs"

[[test]]
name = "tests"
path = "src/tests.rs"
